<div class="admin-toolbar">
  <div class="admin-toolbar-inner">
    <div class="admin-toolbar-left">
      <div class="admin-badge">Modo Administrador</div>
      <div class="admin-msg">Estás viendo este evento como Administrador</div>
      {% if not event.is_active %}
        <span class="status-badge is-inactive" style="margin-left:8px">Evento oculto</span>
      {% endif %}
    </div>
    <div class="admin-toolbar-actions">
      <a class="btn btn-ghost btn-sm" href="{{ url_for('admin.edit_event', event_id=event.id) }}">Editar</a>
      <form class="admin-toggle-form" method="post" action="{{ url_for('admin.toggle_event', event_id=event.id) }}" onsubmit="return confirm('{{ '¿Activar este evento oculto?' if not event.is_active else '¿Ocultar este evento?' }}');">
        {{ toggle_form.csrf_token(id='toolbar-toggle-csrf-' ~ event.id) }}
        <button class="btn btn-sm {{ 'btn-primary' if not event.is_active else 'btn-danger' }}" type="submit">
          {{ 'Activar evento' if not event.is_active else 'Ocultar evento' }}
        </button>
      </form>
      <a class="btn btn-primary btn-sm" href="#inventory">Modificar stock</a>
    </div>
  </div>
</div>

<style>
.admin-toolbar{border:1px solid rgba(255,255,255,0.04);background:linear-gradient(180deg,rgba(0,0,0,0.02),transparent);padding:12px 16px;margin-bottom:18px;border-radius:8px}
.admin-toolbar-inner{display:flex;justify-content:space-between;align-items:center;gap:12px}
.admin-toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.admin-badge{background:rgba(0,255,230,0.06);color:var(--cyan);padding:6px 10px;border-radius:6px;font-weight:700;font-size:13px}
.admin-msg{color:var(--text-muted);font-size:13px;margin-left:8px}
.admin-toolbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.admin-toolbar-actions .btn{margin-left:0}
@media(max-width:720px){.admin-toolbar-inner{flex-direction:column;align-items:flex-start}}</style>
